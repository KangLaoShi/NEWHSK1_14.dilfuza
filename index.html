        const grammarPoints = [

        const grammarTestQuestions = [

        // --- ICONS ---
        const IconSound = () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth={2} viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M11 5L6 9H2v6h4l5 4V5z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
        );

        const IconCheck = () => (
          <svg className="w-6 h-6 text-green-500" fill="none" stroke="currentColor" strokeWidth={2} viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        );

        const IconX = () => (
          <svg className="w-6 h-6 text-red-500" fill="none" stroke="currentColor" strokeWidth={2} viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        );

        // --- HELPER FUNCTIONS ---
        const playAudio = (text) => {
          if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            window.speechSynthesis.speak(utterance);
          }
        };

        const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);

        // --- COMPONENTS ---

        function VocabFlashcards() {
          const [index, setIndex] = useState(0);
          const [isFlipped, setIsFlipped] = useState(false);
          const word = vocabList[index];

          const handleNext = () => {
            setIsFlipped(false);
            setIndex((prev) => (prev + 1) % vocabList.length);
          };

          const handlePrev = () => {
            setIsFlipped(false);
            setIndex((prev) => (prev - 1 + vocabList.length) % vocabList.length);
          };

          return (
            <div className="flex flex-col items-center justify-center space-y-8 animate-in fade-in zoom-in duration-500">
              <div className="text-center text-indigo-400 font-medium">
                So'z {index + 1} / {vocabList.length}
              </div>
              
              <div 
                className="relative w-full max-w-sm h-80 perspective-1000 cursor-pointer group"
                onClick={() => setIsFlipped(!isFlipped)}
              >
                <div className={`w-full h-full absolute transition-transform duration-700 preserve-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                  
                  {/* Front */}
                  <div className="w-full h-full absolute backface-hidden bg-white rounded-3xl shadow-xl border border-indigo-50 flex flex-col items-center justify-center p-6 text-center hover:shadow-2xl transition-shadow">
                    <h2 className="text-8xl font-bold text-slate-800 mb-4">{word.zh}</h2>
                    <button 
                      onClick={(e) => { e.stopPropagation(); playAudio(word.zh); }}
                      className="mt-4 p-3 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 transition-colors"
                    >
                      <IconSound />
                    </button>
                  </div>
                  
                  {/* Back */}
                  <div className="w-full h-full absolute backface-hidden rotate-y-180 bg-gradient-to-br from-indigo-600 to-teal-600 rounded-3xl shadow-xl text-white flex flex-col items-center justify-center p-6 text-center">
                    <h2 className="text-4xl font-bold mb-2 text-white">{word.py}</h2>
                    <div className="w-16 h-1 bg-white/30 rounded-full my-4"></div>
                    <p className="text-xl font-medium mb-1 text-teal-100">{word.uz}</p>
                    <p className="text-md opacity-90 mb-1">{word.ru}</p>
                    <p className="text-md opacity-80 italic">{word.en}</p>
                    <button 
                      onClick={(e) => { e.stopPropagation(); playAudio(word.zh); }}
                      className="mt-6 p-3 bg-white/20 rounded-full hover:bg-white/30 transition-colors"
                    >
                      <IconSound />
                    </button>
                  </div>

                </div>
              </div>

              <div className="flex space-x-6">
                <button onClick={handlePrev} className="px-6 py-3 bg-white shadow border border-slate-100 rounded-xl hover:bg-slate-50 transition-colors text-slate-700 font-medium">
                  Oldingi
                </button>
                <button onClick={handleNext} className="px-6 py-3 bg-indigo-600 shadow-lg shadow-indigo-200 text-white rounded-xl hover:bg-indigo-700 transition-colors font-medium">
                  Keyingi
                </button>
              </div>
            </div>
          );
        }

        function VocabTest() {
          const [questions, setQuestions] = useState([]);
          const [currentQ, setCurrentQ] = useState(0);
          const [score, setScore] = useState(0);
          const [showResult, setShowResult] = useState(false);
          const [selectedAns, setSelectedAns] = useState(null);

          useEffect(() => {
            generateTest();
          }, []);

          const generateTest = () => {
            const shuffledVocab = shuffle([...vocabList]);
            const qs = shuffledVocab.map((target) => {
              const wrongOptions = shuffle(vocabList.filter(v => v.zh !== target.zh)).slice(0, 3);
              const options = shuffle([target, ...wrongOptions]);
              return {
                target,
                options,
                ansIndex: options.findIndex(o => o.zh === target.zh)
              };
            });
            setQuestions(qs);
            setCurrentQ(0);
            setScore(0);
            setShowResult(false);
            setSelectedAns(null);
          };

          if (questions.length === 0) return <div>Loading...</div>;

          const q = questions[currentQ];

          const handleSelect = (idx) => {
            if (selectedAns !== null) return;
            setSelectedAns(idx);
            if (idx === q.ansIndex) setScore(s => s + 1);
            
            setTimeout(() => {
              if (currentQ + 1 < questions.length) {
                setCurrentQ(c => c + 1);
                setSelectedAns(null);
              } else {
                setShowResult(true);
              }
            }, 1200);
          };

          if (showResult) {
            return (
              <div className="text-center bg-white p-10 rounded-3xl shadow-xl max-w-lg mx-auto border border-slate-100">
                <h2 className="text-4xl font-bold text-indigo-900 mb-4">Test Yakunlandi!</h2>
                <p className="text-2xl text-slate-700 mb-8">Natija: <span className="text-indigo-600 font-bold">{score} / {questions.length}</span></p>
                <button onClick={generateTest} className="px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">
                  Qayta boshlash
                </button>
              </div>
            );
          }

          return (
            <div className="max-w-xl mx-auto">
              <div className="bg-white p-8 rounded-3xl shadow-xl border border-slate-100 relative overflow-hidden">
                <div className="absolute top-0 left-0 h-1.5 bg-indigo-100 w-full">
                  <div className="h-full bg-teal-500 transition-all duration-500" style={{width: `${(currentQ / questions.length) * 100}%`}}></div>
                </div>
                
                <p className="text-sm font-semibold text-teal-600 uppercase tracking-widest mb-6">Savol {currentQ + 1} / {questions.length}</p>
                <h3 className="text-xl text-slate-600 mb-4 font-medium">Ushbu iyeroglif qanday ma'noni anglatadi?</h3>
                <div className="text-center my-8">
                  <span className="text-8xl font-bold text-slate-800">{q.target.zh}</span>
                </div>

                <div className="grid grid-cols-1 gap-3">
                  {q.options.map((opt, idx) => {
                    let btnClass = "bg-slate-50 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700";
                    if (selectedAns !== null) {
                      if (idx === q.ansIndex) btnClass = "bg-green-100 border-green-400 text-green-800 font-bold";
                      else if (idx === selectedAns) btnClass = "bg-red-100 border-red-400 text-red-800";
                      else btnClass = "bg-slate-50 border-slate-200 opacity-50";
                    }

                    return (
                      <button
                        key={idx}
                        onClick={() => handleSelect(idx)}
                        disabled={selectedAns !== null}
                        className={`p-4 rounded-xl border-2 transition-all duration-300 text-left text-lg ${btnClass} flex justify-between items-center`}
                      >
                        <span>{opt.uz}</span>
                        {selectedAns !== null && idx === q.ansIndex && <IconCheck />}
                        {selectedAns === idx && idx !== q.ansIndex && <IconX />}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        }

        function DialogueSection() {
          return (
            <div className="space-y-12 max-w-2xl mx-auto">
              {dialogues.map((dialogue, dIdx) => (
                <div key={dIdx} className="bg-white p-6 md:p-8 rounded-3xl shadow-lg border border-slate-100">
                  <h2 className="text-2xl font-bold text-indigo-900 mb-6 pb-4 border-b border-indigo-50">{dialogue.title}</h2>
                  <div className="space-y-6">
                    {dialogue.lines.map((line, lIdx) => (
                      <div key={lIdx} className="flex gap-4">
                        <div className="flex-shrink-0 w-12 h-12 bg-teal-100 text-teal-700 rounded-full flex items-center justify-center font-bold text-lg border-2 border-white shadow-sm">
                          {line.speaker[0]}
                        </div>
                        <div className="flex-1 bg-slate-50 rounded-2xl rounded-tl-none p-5 relative group border border-slate-100">
                          <button 
                            onClick={() => playAudio(line.zh)}
                            className="absolute top-4 right-4 text-slate-400 hover:text-indigo-600 transition"
                          >
                            <IconSound />
                          </button>
                          <p className="text-xs font-bold text-slate-400 mb-1">{line.speaker}</p>
                          <p className="text-xl font-bold text-slate-800 pr-8">{line.zh}</p>
                          <p className="text-md text-indigo-600 mt-2 mb-3">{line.py}</p>
                          <div className="space-y-1 border-t border-slate-200 pt-3">
                            <p className="text-sm text-teal-800"><span className="font-semibold">UZ:</span> {line.uz}</p>
                            <p className="text-sm text-slate-600"><span className="font-semibold">RU:</span> {line.ru}</p>
                            <p className="text-sm text-slate-500 italic"><span className="font-semibold">EN:</span> {line.en}</p>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          );
        }

        function GrammarSection() {
          return (
            <div className="space-y-8 max-w-3xl mx-auto">
              {grammarPoints.map((point, idx) => (
                <div key={idx} className="bg-white p-6 md:p-8 rounded-3xl shadow-lg border border-slate-100">
                  <h2 className="text-2xl font-bold text-indigo-900">{point.title_zh}</h2>
                  <h3 className="text-lg font-semibold text-teal-600 mb-4">{point.title_uz}</h3>
                  
                  <div className="bg-slate-50 p-4 rounded-xl mb-6 space-y-2 border-l-4 border-indigo-500">
                    <p className="text-slate-700"><span className="font-bold">UZ:</span> {point.desc_uz}</p>
                    <p className="text-slate-600 text-sm"><span className="font-bold">RU:</span> {point.desc_ru}</p>
                    <p className="text-slate-500 text-sm italic"><span className="font-bold">EN:</span> {point.desc_en}</p>
                  </div>

                  <h4 className="font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <div className="w-2 h-2 bg-teal-500 rounded-full"></div>
                    Misollar (Examples)
                  </h4>
                  <ul className="space-y-3">
                    {point.examples.map((ex, eIdx) => (
                      <li key={eIdx} className="bg-white border border-slate-100 shadow-sm p-4 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-4 group hover:border-indigo-200 transition">
                        <div>
                          <p className="text-lg font-bold text-slate-800">{ex.zh}</p>
                          <p className="text-sm text-indigo-600 mb-1">{ex.py}</p>
                          <p className="text-sm text-slate-600">{ex.uz}</p>
                        </div>
                        <button 
                          onClick={() => playAudio(ex.zh)}
                          className="w-10 h-10 flex-shrink-0 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center hover:bg-indigo-100 transition sm:opacity-0 group-hover:opacity-100"
                        >
                          <IconSound />
                        </button>
                      </li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
          );
        }

        function GrammarTest() {
          const [currentQ, setCurrentQ] = useState(0);
          const [score, setScore] = useState(0);
          const [showResult, setShowResult] = useState(false);
          const [selectedAns, setSelectedAns] = useState(null);

          const questions = useMemo(() => {
            return shuffle(grammarTestQuestions.map(q => {
              const optObjs = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.ans }));
              const shuffledOpts = shuffle(optObjs);
              return {
                ...q,
                options: shuffledOpts.map(o => o.text),
                ansIndex: shuffledOpts.findIndex(o => o.isCorrect)
              };
            })).slice(0, 15);
          }, []);

          const handleSelect = (idx) => {
            if (selectedAns !== null) return;
            setSelectedAns(idx);
            if (idx === questions[currentQ].ansIndex) setScore(s => s + 1);
            
            setTimeout(() => {
              if (currentQ + 1 < questions.length) {
                setCurrentQ(c => c + 1);
                setSelectedAns(null);
              } else {
                setShowResult(true);
              }
            }, 1500);
          };

          const resetTest = () => {
            setCurrentQ(0);
            setScore(0);
            setShowResult(false);
            setSelectedAns(null);
          };

          if (showResult) {
            return (
              <div className="text-center bg-white p-10 rounded-3xl shadow-xl max-w-lg mx-auto border border-slate-100">
                <h2 className="text-4xl font-bold text-indigo-900 mb-4">Test Yakunlandi!</h2>
                <p className="text-2xl text-slate-700 mb-8">Natija: <span className="text-indigo-600 font-bold">{score} / {questions.length}</span></p>
                <button onClick={resetTest} className="px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">
                  Qayta boshlash
                </button>
              </div>
            );
          }

          const q = questions[currentQ];

          return (
            <div className="max-w-2xl mx-auto">
              <div className="bg-white p-8 md:p-10 rounded-3xl shadow-xl border border-slate-100 relative overflow-hidden">
                <div className="absolute top-0 left-0 h-1.5 bg-indigo-100 w-full">
                  <div className="h-full bg-indigo-500 transition-all duration-500" style={{width: `${(currentQ / questions.length) * 100}%`}}></div>
                </div>
                
                <p className="text-sm font-semibold text-indigo-400 uppercase tracking-widest mb-6">Savol {currentQ + 1} / {questions.length}</p>
                
                <h3 className="text-3xl text-slate-800 font-bold mb-2 text-center leading-relaxed">
                  {q.q.split('___').map((part, i, arr) => (
                    <Fragment key={i}>
                      {part}
                      {i < arr.length - 1 && <span className="inline-block w-16 border-b-2 border-indigo-500 mx-2 -mb-2"></span>}
                    </Fragment>
                  ))}
                </h3>
                <p className="text-xl text-indigo-500 mb-8 text-center font-medium">
                  {q.py.split('___').map((part, i, arr) => (
                    <Fragment key={i}>
                      {part}
                      {i < arr.length - 1 && <span className="inline-block w-12 border-b-2 border-indigo-200 mx-2 -mb-1 opacity-60"></span>}
                    </Fragment>
                  ))}
                </p>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {q.options.map((opt, idx) => {
                    let btnClass = "bg-slate-50 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700";
                    if (selectedAns !== null) {
                      if (idx === q.ansIndex) btnClass = "bg-green-100 border-green-400 text-green-800 font-bold shadow-sm";
                      else if (idx === selectedAns) btnClass = "bg-red-100 border-red-400 text-red-800";
                      else btnClass = "bg-slate-50 border-slate-200 opacity-40";
                    }

                    return (
                      <button
                        key={idx}
                        onClick={() => handleSelect(idx)}
                        disabled={selectedAns !== null}
                        className={`p-5 rounded-2xl border-2 transition-all duration-300 text-center text-2xl font-bold ${btnClass}`}
                      >
                        {opt}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        }

        function FillInBlanks() {
          const [answers, setAnswers] = useState({});
          const [showResults, setShowResults] = useState(false);

          const options = useMemo(() => {
            const list = vocabList.map(v => v.zh).sort();
            return ["", ...list];
          }, []);

          const handleChange = (qIndex, value) => {
            setAnswers(prev => ({ ...prev, [qIndex]: value }));
          };

          const calculateScore = () => {
            let score = 0;
            fillInBlanksQuestions.forEach((q, idx) => {
              if (answers[idx] === q.ans) score++;
            });
            return score;
          };

          const handleCheck = () => {
            setShowResults(true);
          };

          const handleReset = () => {
            setAnswers({});
            setShowResults(false);
          };

          return (
            <div className="max-w-3xl mx-auto space-y-6">
              
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
                 <h2 className="text-xl font-bold text-indigo-900 mb-2">So'zlarni to'ldirish</h2>
                 <p className="text-slate-600">Quyidagi gaplardagi bo'sh joylarga mos keladigan so'zni tanlang.</p>
              </div>

              <div className="space-y-4">
                {fillInBlanksQuestions.map((q, idx) => {
                  const isCorrect = answers[idx] === q.ans;
                  const isAnswered = answers[idx] !== undefined && answers[idx] !== "";
                  
                  return (
                    <div key={idx} className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
                      <div className="flex-1">
                        <div className="text-xl text-slate-800 font-medium leading-loose flex items-center flex-wrap">
                          <span className="text-slate-400 text-sm mr-3 font-bold">{idx + 1}.</span>
                          <span>{q.text[0]}</span>
                          <select 
                            value={answers[idx] || ""}
                            onChange={(e) => handleChange(idx, e.target.value)}
                            disabled={showResults}
                            className={`mx-2 text-center p-1 rounded-md border-b-2 font-bold focus:outline-none transition-colors cursor-pointer min-w-[80px] bg-slate-50
                              ${showResults 
                                ? isCorrect 
                                  ? 'border-green-500 text-green-700 bg-green-50' 
                                  : 'border-red-500 text-red-700 bg-red-50'
                                : 'border-indigo-400 text-indigo-700 focus:border-teal-500 focus:bg-teal-50'
                              }`}
                          >
                            <option value="" disabled>___</option>
                            {vocabList.map(v => (
                              <option key={v.zh} value={v.zh}>{v.zh}</option>
                            ))}
                          </select>
                          <span>{q.text[1]}</span>
                        </div>
                        <div className="text-base text-indigo-500 mt-1 ml-8 md:ml-10 tracking-wide italic">
                          {q.py[0]} <span className="inline-block w-10 border-b-2 border-indigo-200 mx-1 align-middle opacity-50"></span> {q.py[1]}
                        </div>
                      </div>

                      {showResults && (
                        <div className="flex-shrink-0 flex items-center justify-end w-24">
                          {isCorrect ? (
                            <span className="flex items-center text-green-600 font-bold bg-green-50 px-3 py-1 rounded-full text-sm">
                              <IconCheck /> To'g'ri
                            </span>
                          ) : (
                            <span className="flex items-center text-red-600 font-bold bg-red-50 px-3 py-1 rounded-full text-sm">
                              <IconX /> {q.ans}
                            </span>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>

              <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-100 sticky bottom-4 flex flex-col sm:flex-row justify-between items-center gap-4 mt-8">
                {showResults ? (
                  <Fragment>
                    <p className="text-2xl font-bold text-slate-800">
                      Natija: <span className="text-indigo-600">{calculateScore()} / {fillInBlanksQuestions.length}</span>
                    </p>
                    <button onClick={handleReset} className="px-8 py-3 bg-slate-200 text-slate-800 font-bold rounded-xl hover:bg-slate-300 transition w-full sm:w-auto">
                      Qayta ishlash
                    </button>
                  </Fragment>
                ) : (
                  <button 
                    onClick={handleCheck} 
                    className="w-full px-8 py-4 bg-teal-600 text-white font-bold rounded-xl hover:bg-teal-700 transition shadow-lg text-lg"
                  >
                    Tekshirish
                  </button>
                )}
              </div>

            </div>
          );
        }

        // --- MAIN APP COMPONENT ---
        function App() {
          const [activeTab, setActiveTab] = useState('vocab');

          return (
            <div>
              {/* HEADER */}
              <header className="bg-white/70 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-indigo-100">
                <div className="max-w-5xl mx-auto px-4 py-4 md:py-6">
                  <h1 className="text-2xl md:text-3xl font-bold text-indigo-900 text-center tracking-tight">
                    第十四课：我看了一个电影
                  </h1>
                  <h2 className="text-sm md:text-base text-indigo-600 text-center mt-1 font-medium">
                    Dilfuza Kāng lǎo shī bilan xitoy tilini o'rganmiz
                  </h2>
                </div>
                
                {/* NAVIGATION */}
                <div className="max-w-5xl mx-auto px-2 pb-2 overflow-x-auto">
                  <div className="flex space-x-2 w-max mx-auto md:w-full md:justify-center">
                    {[
                      { id: 'vocab', label: "Lug'at" },
                      { id: 'vocabTest', label: "Lug'at testi" },
                      { id: 'dialogue', label: "Muloqot" },
                      { id: 'grammar', label: "Grammatika" },
                      { id: 'grammarTest', label: "Grammatika testi" },
                      { id: 'fillBlanks', label: "So'zlarni to'ldirish" }
                    ].map((tab) => (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`px-4 py-2 rounded-full text-sm font-semibold transition-all duration-300 ${
                          activeTab === tab.id 
                            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' 
                            : 'bg-white text-indigo-600 hover:bg-indigo-50 hover:text-indigo-800 border border-indigo-100'
                        }`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </div>
                </div>
              </header>

              {/* CONTENT AREA */}
              <main className="max-w-4xl mx-auto p-4 py-8 min-h-[70vh]">
                {activeTab === 'vocab' && <VocabFlashcards />}
                {activeTab === 'vocabTest' && <VocabTest />}
                {activeTab === 'dialogue' && <DialogueSection />}
                {activeTab === 'grammar' && <GrammarSection />}
                {activeTab === 'grammarTest' && <GrammarTest />}
                {activeTab === 'fillBlanks' && <FillInBlanks />}
              </main>

              {/* FOOTER */}
              <footer className="bg-slate-900 text-slate-400 py-6 text-center text-sm border-t border-slate-800 mt-12">
                <p>HSK 1 NEW3.0 - Lesson 14</p>
                <p className="mt-1">© 2026 Dilfuza Kāng lǎo shī (telegram@diffila)</p>
              </footer>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
